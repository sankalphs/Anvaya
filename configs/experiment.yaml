experiment:
  name: hh-goa-msmarco-xi
  seed: 20260818

dataset:
  repository: ai4bharat/MSMARCO-XI
  revision: null  # resolved to and recorded as an immutable Hub commit SHA
  language: auto  # repository default (Hindi) because MSMARCO-XI has no Konkani config
  dev_source_split: train
  test_source_split: validation
  dev_queries: 1000
  test_queries: 1000
  sampling_acceptance_rate: 0.20
  max_rows_scanned_multiplier: 20
  passage_field: Translated_passages
  query_field: query
  output_dir: data/processed
  retain_raw_parquet: false  # files are 0.46-3.72 GB; processed artifacts remain cached

cache:
  root: cache
  huggingface: cache/huggingface
  models: cache/models
  embeddings: cache/embeddings
  indexes: cache/indexes

retrieval:
  normalize_embeddings: true
  top_k: 10
  search_oversample: 20
  warmup_queries: 20
  baseline_chunking:
    strategy: fixed_words
    size: 128
    overlap: 0

embedding_ablation:
  split: dev
  batch_size: 32
  indicbert_batch_size: 4
  max_sequence_length: 512
  dtype: bfloat16
  models:
    - BAAI/bge-m3
    - intfloat/multilingual-e5-base
    - Alibaba-NLP/gte-multilingual-base
    - jinaai/jina-embeddings-v3
    - ai4bharat/IndicBERT-v3-4B
  selection_metrics:
    - ndcg_at_10
    - mrr_at_10
    - recall_at_10

chunking_ablation:
  split: dev
  batch_size: 32
  strategies:
    - name: fixed_size
      strategy: fixed_words
      size: 128
      overlap: 0
    - name: overlapping
      strategy: fixed_words
      size: 128
      overlap: 32
    - name: sentence_based
      strategy: sentence
      max_words: 128
    - name: semantic
      strategy: semantic
      min_words: 40
      max_words: 160
      similarity_threshold: 0.65
    - name: parent_child
      strategy: parent_child
      child_size: 64
      child_overlap: 16
      include_parent: true
  selection_metrics:
    - ndcg_at_10
    - mrr_at_10
    - recall_at_10
